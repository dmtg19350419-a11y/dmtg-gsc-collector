name: Manual GSC read-only check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-gsc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify OAuth, exact property and one final-data page
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GSC_SITE_URL: sc-domain:dalianmachine.com
          GOOGLE_OAUTH_SCOPE: https://www.googleapis.com/auth/webmasters.readonly
          DMTG_GSC_COLLECTOR_RUNTIME: github_actions
        run: node src/github.js readonly
